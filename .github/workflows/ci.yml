name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit tests, build, e2e (no-DB scope)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm (version declared in package.json)
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build (public site must build without credentials)
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser e2e tests (public site; admin suite auto-skips without DB env)
        run: pnpm test:e2e

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-screenshots
          path: test-results/screenshots/
          retention-days: 7
          if-no-files-found: ignore

  db-integration:
    name: Auth DB integration (disposable PostgreSQL 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nokmel_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nokmel_ci_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm (version declared in package.json)
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Drizzle migration metadata check
        run: pnpm db:check

      - name: Apply migrations through the operator wrapper (disposable DB)
        run: pnpm db:migrate
        env:
          DATABASE_URL_DIRECT: postgresql://postgres:postgres@127.0.0.1:5432/nokmel_ci_test?sslmode=disable

      - name: Authentication DB integration tests (migrations from empty schema + auth flows + provisioning + runtime role)
        run: pnpm test:db

  e2e-auth:
    name: Admin, plans & join e2e (disposable PostgreSQL 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nokmel_ci_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nokmel_ci_e2e?sslmode=disable
      BETTER_AUTH_SECRET: ci-disposable-e2e-secret-0123456789abcdef0123456789
      BETTER_AUTH_URL: http://127.0.0.1:3100
      TRUSTED_ORIGINS: http://127.0.0.1:3100
      OWNER_EMAIL: owner@nokmel-ci-e2e.test
      E2E_OWNER_PASSWORD: ci-disposable-e2e-owner-password-123
      RATE_LIMIT_SIGNIN_MAX: '50'
      NOKMEL_DISPOSABLE_TEST_ENV: '1'
      JOIN_INTAKE_ENABLED: '1'
      JOIN_RATE_LIMIT_MAX: '100'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm (version declared in package.json)
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Production build (packaged server for e2e)
        run: pnpm build

      - name: Browser e2e tests (public + admin flows against disposable DB)
        run: pnpm test:e2e

      - name: Upload admin/plans/join e2e screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: admin-e2e-screenshots
          path: test-results/screenshots/
          retention-days: 7
          if-no-files-found: ignore
